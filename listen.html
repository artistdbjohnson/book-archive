<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Listen — First Water — dglxss.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4f3f0;--page:#fbf9f4;--text:#0a0a0a;--muted:#6a6a6a;--line:rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--page);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
header span{font-size:11px;color:var(--muted)}
main{max-width:28rem;margin:0 auto;padding:3rem 1.5rem}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.sub{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 28px}
.stage{padding-top:18px;border-top:1px solid var(--line)}
.credit{font-size:11px;color:var(--muted);margin:0 0 8px}
audio{width:100%;height:36px}
.status{font-size:11px;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>
<header><a href="/">← Archive</a><span>Listen</span></header>
<main>
  <h1>Quantum Frontier: First Water</h1>
  <div class="sub">Sera Holt · water circuit<br>2026 · Fiction<br>Read by Leo</div>
  <div class="stage">
    <div class="credit">Read by Leo</div>
    <audio id="player" controls preload="metadata"></audio>
    <div class="status" id="status">Leo · hired reader</div>
  </div>
</main>
<script>
(function(){
  var a=document.getElementById('player'), st=document.getElementById('status');
  var srcs=['/ark-survey-ch01-v2-leo.mp3','/audio/ark-survey-ch01-v2-leo.mp3','/audio/first-water.mp3'];
  var i=0;
  function next(){
    if(i>=srcs.length){ st.textContent='Audio file is not on this host yet.'; return; }
    a.src=srcs[i++];
    st.textContent = i<=1 ? 'Leo · hired reader' : 'Leo · hired reader · part '+String(i).padStart(2,'0');
  }
  a.addEventListener('error', next);
  a.addEventListener('ended', function(){ if(i<srcs.length) next(); else st.textContent='Leo · hired reader · end'; });
  next();
})();
</script>
</body>
</html>
