<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="manifest" href="/manifest.json"/>
<title>Archive — dglxss.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4f3f0;--paper:#fbf9f4;--paper-solid:#fafaf8;--text:#0a0a0a;--muted:#6a6a6a;--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.22);--page:#fbf9f4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}a{color:inherit;text-decoration:none}
button:not(:disabled){cursor:pointer}
.shell{min-height:100%;display:flex;flex-direction:column}
.preview-banner{font-size:10px;font-weight:500;letter-spacing:.04em;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
header.site-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(251,249,244,.92)}
.brand{font-weight:600;font-size:13px;letter-spacing:.02em;background:none;border:0;color:inherit;padding:0}
.brand span{font-weight:400;color:var(--muted)}
.controls{display:flex;gap:4px}
.ctrl{font-size:11px;font-weight:500;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;height:28px}
.ctrl.on{color:var(--text);border-color:var(--text)}
main{flex:1}
.list-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:hover{background:rgba(0,0,0,.02)}
.list-row .t{font-size:15px;font-weight:700;letter-spacing:-.02em}
.list-row .m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.list-row.soon{opacity:.78}
.list-section{padding:18px 20px;font-size:15px;font-weight:700;letter-spacing:-.02em;text-transform:none;color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.list-section .sec-copy,.list-rail .section .sec-copy{display:flex;flex-direction:column;align-items:flex-start}
.list-section .t,.list-rail .section .t{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.list-section .m,.list-rail .section .m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400;letter-spacing:0}
.gallery{display:none;padding:32px 24px 48px;gap:20px;grid-template-columns:repeat(auto-fill,minmax(180px,220px));justify-content:center;max-width:920px;margin:0 auto}
body.is-gallery .list-view{display:none}
body.is-gallery .gallery{display:grid}
.g-card{border:1px solid var(--line);background:var(--paper-solid);cursor:pointer;overflow:hidden}
.g-cover{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 14px;font-size:14px;font-weight:700;letter-spacing:.06em;background:#ecebe4;border-bottom:1px solid var(--line)}
.g-meta{padding:12px 14px}
.g-meta .t{font-size:13px;font-weight:700}
.g-meta .m{font-size:11px;color:var(--muted);margin-top:3px}
.detail{display:none;padding:28px 22px 64px;max-width:680px;margin:0 auto}
body.is-detail .detail{display:block}
body.is-detail .list-view,body.is-detail .gallery{display:none}
.back-shelf{display:block;border:0;background:none;color:var(--muted);font-size:11px;padding:0 0 18px;letter-spacing:.02em}
.detail h1{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-bottom:6px}
.detail .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.55;font-weight:400}
.detail .blurb{font-size:13.5px;line-height:1.7;margin-bottom:22px;max-width:42ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-size:11px;font-weight:600;padding:10px 14px;border:1px solid var(--text);background:transparent;color:var(--text);height:36px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.ghost{border-color:var(--line-strong)}
.btn:disabled{opacity:.45}
.audio-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.audio-row audio,.reader-player audio{width:100%;height:36px}
.audio-credit{font-size:11px;color:var(--muted);margin:0 0 8px}
.skip{display:flex;gap:8px;margin:10px 0 0}
.skip button{flex:1;height:32px;border:1px solid var(--text);background:transparent;color:var(--text);font-size:11px;font-weight:600}
.audio-status{font-size:11px;color:var(--muted);margin:8px 0 0}
.reader-root{display:none;position:fixed;inset:0;z-index:40;background:var(--page);--reader-size:15px;--reader-lh:1.8;--reader-pad-x:2.5rem;font-size:var(--reader-size)}
.reader-root[data-size="s"]{--reader-size:13px}
.reader-root[data-size="m"]{--reader-size:15px}
.reader-root[data-size="l"]{--reader-size:18px}
.reader-root[data-line="snug"]{--reader-lh:1.55}
.reader-root[data-line="regular"]{--reader-lh:1.8}
.reader-root[data-line="loose"]{--reader-lh:2.05}
.reader-root[data-margin="narrow"]{--reader-pad-x:1.15rem}
.reader-root[data-margin="regular"]{--reader-pad-x:1.75rem}
.reader-root[data-margin="wide"]{--reader-pad-x:2.6rem}
.reader-root.open{display:flex;flex-direction:column}
.reader-chrome{min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--page);flex-shrink:0;position:relative}
.reader-chrome-inner{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:36rem;min-width:0;position:relative;flex-wrap:nowrap}
.reader-chrome-left,.reader-chrome-actions{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:nowrap}
.reader-chrome-left{flex:1 1 auto}
.reader-chrome-actions{flex:0 0 auto}
.reader-chrome button,.reader-link{border:0;background:transparent;color:var(--muted);font-size:11px;height:28px;padding:0;letter-spacing:.02em;white-space:nowrap}
.reader-chrome button.on,.reader-link.on{color:var(--text)}
.reader-chrome button:hover,.reader-link:hover{color:var(--text)}
.reader-back{max-width:7.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;text-align:left}
.reader-aa{font-weight:500;min-width:1.4em}
.reader-seg{display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
.reader-seg button{height:26px;padding:0 8px;border-radius:999px}
.reader-chrome .reader-seg button.on{background:var(--text);color:#fff}
.reader-chrome .reader-seg button.on:hover{color:#fff}
.reader-chrome .reader-buy{background:var(--text);color:#fff;height:26px;padding:0 10px;border-radius:999px;font-weight:500;flex-shrink:0}
.reader-chrome .reader-buy:hover{color:#fff;opacity:.9}
.reader-resume{font-size:11px;color:var(--muted);padding:8px 14px 0;flex-shrink:0}
.reader-resume button{border:0;background:none;color:var(--text);font-size:11px;padding:0;margin-left:8px}
.reader-player{padding:10px 12px 12px;border-bottom:1px solid var(--line);background:var(--page);flex-shrink:0}
.scroll-inner{flex:1;overflow:auto;max-width:36rem;margin:0 auto;width:100%;padding:2.5rem var(--reader-pad-x) 4.5rem;font-family:'JetBrains Mono',ui-monospace,monospace;scrollbar-width:none}
.scroll-inner::-webkit-scrollbar{display:none}
.scroll-inner h1{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.35rem}
.scroll-inner .sub{font-size:11px;color:var(--muted);margin-bottom:2rem}
.scroll-inner p{font-size:1em;line-height:var(--reader-lh);margin:0 0 1em}
.scroll-inner .chapter-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2rem 0 1rem}
.pageview{position:relative;flex:1;min-height:0;display:none;flex-direction:column}
.reader-root.mode-pages .scroll-inner{display:none}
.reader-root.mode-pages .pageview{display:flex}
.page-body{flex:1;min-height:0;overflow:hidden;padding:2.25rem var(--reader-pad-x) 1.5rem;font-size:1em;line-height:var(--reader-lh);scrollbar-width:none;max-width:36rem;width:100%;margin:0 auto}
.page-body .pg-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1.15em}
.page-body p{margin:0 0 1em}
.page-measure{position:absolute;left:-9999px;top:0;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;flex:none!important;visibility:hidden;pointer-events:none}
.page-foot{flex-shrink:0;display:flex;justify-content:space-between;padding:12px 1.5rem 14px;font-size:10px;letter-spacing:.04em;color:var(--muted);max-width:36rem;width:100%;margin:0 auto}
.reader-edge{position:absolute;top:0;bottom:36px;width:18%;max-width:88px;z-index:5;border:0;background:transparent;padding:0}
.reader-edge.left{left:0;cursor:w-resize}
.reader-edge.right{right:0;cursor:e-resize}
.reader-menu{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:60;min-width:248px;max-width:min(320px,calc(100vw - 28px));max-height:50vh;overflow:auto;background:var(--paper);border:1px solid var(--text)}
.reader-menu.open{display:block}
.reader-menu-head{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px}
.reader-menu button,.reader-menu .menu-note{display:block;width:100%;text-align:left;font-size:12px;line-height:1.35;padding:10px 12px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);height:auto;letter-spacing:0}
.reader-menu button:disabled{opacity:.4;color:var(--muted);pointer-events:none;cursor:default}
.reader-menu .menu-note{color:var(--muted)}
.reader-menu-rule{border-top:1px solid var(--line-strong);margin:0}
.reader-menu-rule + button{border-top:0}
.reader-type-panel{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:60;min-width:248px;background:var(--paper);border:1px solid var(--text);padding:10px 12px 12px}
.reader-type-panel.open{display:block}
.type-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.type-row + .type-row{border-top:1px solid var(--line)}
.type-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.type-pills{display:flex;align-items:center;gap:4px}
.reader-chrome .reader-type-panel button{height:24px;padding:0 8px;border-radius:999px;font-size:11px;color:var(--muted)}
.reader-chrome .reader-type-panel button.on{background:var(--text);color:#fff}
.reader-chrome .reader-type-panel button.on:hover{color:#fff}
.buy-panel{display:none;padding:14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.buy-panel.open{display:block}
.buy-panel strong{color:var(--text);font-weight:600}
.list-section,.list-rail .section{display:flex;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.list-section::after,.list-rail .section::after{content:'\2013';margin-left:auto;color:var(--muted);font-size:12px}
.list-section.is-collapsed::after,.list-rail .section.is-collapsed::after{content:'+'}
.sec-body.is-collapsed{display:none}
@media(min-width:900px){
  body.is-list main,body.is-detail main{display:grid;grid-template-columns:240px 1fr}
  .list-rail{display:block;border-right:1px solid var(--line);overflow:auto}
  body.is-list .list-view,body.is-detail .list-view{display:none}
  body.is-list .detail,body.is-detail .detail{display:block}
  .back-shelf{display:none}
  .list-rail .row{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
  .list-rail .row.on{background:rgba(0,0,0,.045);border-left:2px solid var(--text)}
  .list-rail .row .t{font-size:13px;font-weight:700}
  .list-rail .row .m{font-size:10px;color:var(--muted);margin-top:3px;font-weight:400}
  .list-rail .section{padding:16px 18px;font-size:13px;font-weight:700;letter-spacing:-.02em;text-transform:none;color:var(--text)}
}
@media(max-width:899px){
  .list-rail{display:none}
  body.is-list:not(.is-detail) .list-view{display:block}
  body.is-detail .list-view,
  body.is-detail .gallery{display:none !important}
  body.is-detail .detail{display:block}
}
@media(max-width:767px){
  .reader-edge{width:28%;max-width:none}
  .page-body{padding:1.5rem var(--reader-pad-x) 1.25rem}
  .reader-chrome{min-height:calc(42px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0}
  .reader-root[data-margin="regular"]{--reader-pad-x:1.35rem}
}
</style>
</head>
<body class="is-list">
<div class="shell">
  <div class="preview-banner">ARCHIVE \u00b7 dglxss. \u00b7 catalog</div>
  <header class="site-hd">
    <button class="brand" id="btn-home" type="button">Archive <span>/ dglxss.</span></button>
    <div class="controls">
      <button class="ctrl on" id="btn-list" type="button">List</button>
      <button class="ctrl" id="btn-gallery" type="button">Gallery</button>
    </div>
  </header>
  <main>
    <aside class="list-rail" id="list-rail"></aside>
    <section>
      <div class="list-view" id="list-view"></div>
      <div class="gallery" id="gallery"></div>
      <div class="detail" id="detail"></div>
    </section>
  </main>
</div>
<div class="reader-root mode-pages" id="reader" data-size="m" data-line="regular" data-margin="regular">
  <div class="reader-chrome">
    <div class="reader-chrome-inner">
    <div class="reader-chrome-left">
      <button type="button" id="btn-back" class="reader-back">\u2190 Archive</button>
      <button type="button" id="btn-contents">Contents</button>
    </div>
    <div class="reader-chrome-actions">
      <button type="button" id="btn-type" class="reader-aa" aria-haspopup="true" aria-expanded="false" aria-controls="type-panel">Aa</button>
      <div class="reader-seg" role="group" aria-label="Reading mode">
        <button type="button" id="btn-scroll">Scroll</button>
        <button type="button" id="btn-pages" class="on">Pages</button>
      </div>
      <button type="button" id="btn-buy" class="reader-buy">Buy</button>
    </div>
    <div class="reader-menu" id="contents-menu"></div>
    <div class="reader-type-panel" id="type-panel">
      <div class="type-row">
        <span class="type-label">Size</span>
        <div class="type-pills">
          <button type="button" data-size="s">S</button>
          <button type="button" data-size="m" class="on">M</button>
          <button type="button" data-size="l">L</button>
        </div>
      </div>
      <div class="type-row">
        <span class="type-label">Line</span>
        <div class="type-pills">
          <button type="button" data-line="snug">Snug</button>
          <button type="button" data-line="regular" class="on">Regular</button>
          <button type="button" data-line="loose">Loose</button>
        </div>
      </div>
      <div class="type-row">
        <span class="type-label">Margins</span>
        <div class="type-pills">
          <button type="button" data-margin="narrow">Narrow</button>
          <button type="button" data-margin="regular" class="on">Regular</button>
          <button type="button" data-margin="wide">Wide</button>
        </div>
      </div>
    </div>
    </div>
  </div>
  <div class="reader-resume" id="reader-resume" hidden></div>
  <div class="buy-panel" id="buy-panel"></div>
  <div class="reader-player" id="reader-player" hidden>
    <div class="audio-credit" id="reader-audio-credit">Read by Leo</div>
    <audio id="reader-qf-audio" controls preload="metadata"></audio>
    <div class="skip"><button type="button" data-skip="-15">\u221215</button><button type="button" data-skip="15">+15</button></div>
    <div class="audio-status" id="reader-audio-status">Leo \u00b7 hired reader</div>
  </div>
  <div class="scroll-inner" id="scroll-inner"></div>
  <div class="pageview" id="pageview">
    <button class="reader-edge left" id="edge-left" type="button" aria-label="Previous page"></button>
    <div class="page-body" id="page-body"></div>
    <button class="reader-edge right" id="edge-right" type="button" aria-label="Next page"></button>
    <div class="page-foot"><span id="page-left"></span><span id="page-right"></span></div>
  </div>
</div>
<script src="/archive.js"></script>
</body>
</html>
