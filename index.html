<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="manifest" href="/manifest.json"/>
<title>Archive — dglxss.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4f3f0;--paper:#fbf9f4;--paper-solid:#fafaf8;--text:#0a0a0a;--muted:#6a6a6a;--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.22);--page:#fbf9f4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}a{color:inherit;text-decoration:none}
button:not(:disabled){cursor:pointer}
.shell{min-height:100%;display:flex;flex-direction:column}
.preview-banner{font-size:10px;font-weight:500;letter-spacing:.04em;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
header.site-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(251,249,244,.92)}
.brand{font-weight:600;font-size:13px;letter-spacing:.02em;background:none;border:0;color:inherit;padding:0}
.brand span{font-weight:400;color:var(--muted)}
.controls{display:flex;gap:4px}
.ctrl{font-size:11px;font-weight:500;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;height:28px}
.ctrl.on{color:var(--text);border-color:var(--text)}
main{flex:1}
.list-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:hover{background:rgba(0,0,0,.02)}
.list-row .t{font-size:15px;font-weight:700;letter-spacing:-.02em}
.list-row .m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.list-row.soon{opacity:.78}
.list-section{padding:18px 20px;font-size:15px;font-weight:700;letter-spacing:-.02em;text-transform:none;color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.list-section .sec-copy,.list-rail .section .sec-copy{display:flex;flex-direction:column;align-items:flex-start}
.list-section .t,.list-rail .section .t{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.list-section .m,.list-rail .section .m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400;letter-spacing:0}
.gallery{display:none;padding:32px 24px 48px;gap:20px;grid-template-columns:repeat(auto-fill,minmax(180px,220px));justify-content:center;max-width:920px;margin:0 auto}
body.is-gallery .list-view{display:none}
body.is-gallery .gallery{display:grid}
.g-card{border:1px solid var(--line);background:var(--paper-solid);cursor:pointer;overflow:hidden}
.g-cover{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 14px;font-size:14px;font-weight:700;letter-spacing:.06em;background:#ecebe4;border-bottom:1px solid var(--line)}
.g-meta{padding:12px 14px}
.g-meta .t{font-size:13px;font-weight:700}
.g-meta .m{font-size:11px;color:var(--muted);margin-top:3px}
.detail{display:none;padding:28px 22px 64px;max-width:680px;margin:0 auto}
body.is-detail .detail{display:block}
body.is-detail .list-view,body.is-detail .gallery{display:none}
.back-shelf{display:block;border:0;background:none;color:var(--muted);font-size:11px;padding:0 0 18px;letter-spacing:.02em}
.detail h1{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-bottom:6px}
.detail .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.55;font-weight:400}
.detail .blurb{font-size:13.5px;line-height:1.7;margin-bottom:22px;max-width:42ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-size:11px;font-weight:600;padding:10px 14px;border:1px solid var(--text);background:transparent;color:var(--text);height:36px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.ghost{border-color:var(--line-strong)}
.btn:disabled{opacity:.45}
.audio-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.audio-row audio,.reader-player audio{width:100%;height:36px}
.audio-credit{font-size:11px;color:var(--muted);margin:0 0 8px}
.skip{display:flex;gap:8px;margin:10px 0 0}
.skip button{flex:1;height:32px;border:1px solid var(--text);background:transparent;color:var(--text);font-size:11px;font-weight:600}
.audio-status{font-size:11px;color:var(--muted);margin:8px 0 0}
body.reader-open{overflow:hidden}
.reader-root{display:none;position:fixed;inset:0;z-index:40;background:#fff;color:#000;--listen-size:20px;font-size:var(--listen-size);font-family:'JetBrains Mono',ui-monospace,monospace;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.reader-root[data-size="s"]{--listen-size:17px}
.reader-root[data-size="m"]{--listen-size:20px}
.reader-root[data-size="l"]{--listen-size:23px}
.reader-root.open{display:flex;flex-direction:column}
.reader-root button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.reader-root button:focus-visible{outline:1px solid #000;outline-offset:3px}
.listen-top,.listen-foot{width:min(100%,calc(46ch + 64px));margin:0 auto;padding-left:32px;padding-right:32px;position:relative;z-index:4;flex-shrink:0}
.listen-top{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:14px;transition:opacity .45s ease,transform .45s ease}
.listen-nav,.listen-controls{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:1.4;font-weight:400;gap:10px}
.listen-nav button,.listen-controls button{border:0;background:transparent;padding:6px 0;color:#8d8d8d;font-size:13px;line-height:1;font-weight:400}
#btn-library,#btn-play{color:#111}
.mode-seg{display:flex;align-items:center;flex:1 1 auto;min-width:0;max-width:17.5rem;gap:2px}
.listen-controls .mode-seg button{flex:1 1 0;min-width:0;height:26px;padding:0 6px;border-radius:999px;font-size:11px;line-height:1;color:#8d8d8d;text-align:center;white-space:nowrap}
.listen-controls .mode-seg button.on{background:#111;color:#fff}
.listen-transport{display:flex;align-items:center;gap:14px;flex:0 0 auto;margin-left:8px}
#btn-play{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0}
#btn-play .icon-pause{display:none}
#btn-play[aria-pressed="true"] .icon-play{display:none}
#btn-play[aria-pressed="true"] .icon-pause{display:block}
#btn-play:disabled{opacity:.35}
.reader-root:not([data-mode="autoplay"]) #btn-play{display:none}
#btn-chapter{white-space:nowrap}
.page-foot{display:none;justify-content:space-between;align-items:baseline;gap:12px;padding-top:8px;font-size:10px;letter-spacing:.04em;color:#8d8d8d;min-width:0}
.reader-root[data-mode="pages"] .page-foot{display:flex}
#page-left{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#page-right{flex-shrink:0;font-variant-numeric:tabular-nums}
.listen-title{margin:16px 0 0;font-size:14px;font-weight:400;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listen-name{color:#111}
.listen-by{color:#9a9a9a}
.listen-stage{position:relative;flex:1;min-height:0}
.listen-art{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#a3a3a3;transition:opacity .5s ease,transform .55s ease}
.listen-art pre{margin:0;width:max-content;max-width:100%;font:12px/1.2 'JetBrains Mono',ui-monospace,monospace;color:#a8a8a8;text-align:left;white-space:pre}
.listen-dots{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:22px}
.listen-dots i{display:block;width:4px;height:4px;border-radius:50%;background:#dedede}
.listen-dots i.on{width:5px;height:5px;background:#8a8a8a}
.reader-root[data-mode="autoplay"].is-reading .listen-top{opacity:0;transform:translateY(-10px);pointer-events:none}
.reader-root.is-reading .listen-art{opacity:0;transform:translateY(-14px)}
.listen-viewport{position:absolute;inset:0;overflow:hidden;z-index:1;touch-action:none}
.reader-root:not([data-mode="autoplay"]) .listen-viewport,
.reader-root:not([data-mode="autoplay"]) .listen-art{display:none}
.listen-flow{opacity:0;transition:opacity .55s ease}
.reader-root.is-reading .listen-flow{opacity:1}
.scroll-view{display:none;position:absolute;inset:0;z-index:1;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y}
.scroll-view::-webkit-scrollbar{display:none}
.reader-root[data-mode="scroll"] .scroll-view{display:block}
.scroll-inner{width:min(calc(100% - 64px),46ch);margin:0 auto;padding:1.15rem 0 72vh}
.scroll-inner .chapter-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d;margin:1.85em 0 .95em}
.scroll-inner .chapter-label:first-child{margin-top:.15em}
.scroll-p{margin:0 0 1.15em;color:#111;font-size:1em;line-height:1.7;font-weight:400}
.pageview{display:none;position:absolute;inset:0;z-index:1;flex-direction:column;min-height:0;overflow:hidden}
.reader-root[data-mode="pages"] .pageview{display:flex}
.page-body{flex:1;min-height:0;overflow:hidden;width:min(calc(100% - 64px),46ch);margin:0 auto;padding:1.15rem 0 .4rem;color:#111;font-size:1em;line-height:1.7}
.page-body .pg-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d;margin:0 0 1.15em}
.page-body p{margin:0 0 1em}
.page-measure{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-1;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;flex:none!important}
.reader-edge{position:absolute;top:0;bottom:0;width:22%;max-width:96px;z-index:5;border:0;background:transparent;padding:0}
.reader-edge.left{left:0;cursor:w-resize}
.reader-edge.right{right:0;cursor:e-resize}
.reader-root[data-mode="scroll"] .scroll-view,
.reader-root[data-mode="pages"] .page-body{user-select:text;-webkit-user-select:text}
.listen-track{width:min(calc(100% - 64px),46ch);margin:0 auto;padding:0 0 62vh;font-weight:400;text-align:left}
.listen-p{margin:0 0 1.35em;color:#c5c5c5;font-size:1em;line-height:1.5;font-weight:400}
.listen-p.is-active{color:#737373}
.listen-p.is-active .w.is-now{color:#000}
.listen-fade{position:absolute;left:0;right:0;pointer-events:none;z-index:3}
.listen-fade-top{top:0;height:22%;background:linear-gradient(to bottom,#fff 0%,rgba(255,255,255,0) 100%)}
.listen-fade-bot{bottom:0;height:38%;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.78) 46%,rgba(255,255,255,0) 100%)}
.listen-foot{padding-top:4px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.listen-progress-wrap{transition:opacity .4s ease}
.reader-root:not([data-mode="autoplay"]) .listen-progress-wrap,
.reader-root:not([data-mode="autoplay"]) .speed-row{display:none}
.reader-root.is-reading .listen-progress-wrap{opacity:0;pointer-events:none}
.listen-progress{position:relative;display:block;width:100%;height:18px;border:0;background:transparent;padding:0}
.listen-progress::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:#e6e6e6}
.listen-progress-fill{position:absolute;left:0;top:8px;height:1px;width:0%;background:#111;pointer-events:none}
.listen-controls{padding-top:2px}
.listen-sheet{display:none;position:absolute;z-index:6;min-width:220px;max-width:min(280px,calc(100vw - 48px));max-height:46vh;overflow:auto;background:#fff;border:1px solid rgba(0,0,0,.08);padding:6px 0}
.listen-sheet.open{display:block}
#edit-sheet{top:calc(100% - 6px);right:32px}
#chapter-sheet{top:auto;bottom:calc(100% - 4px);right:32px}
.listen-sheet .type-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 14px}
.listen-sheet .type-label{font-size:12px;color:#8d8d8d}
.listen-sheet .type-pills{display:flex;align-items:center;gap:10px}
.listen-sheet button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#8d8d8d;font-size:13px;line-height:1.35;padding:9px 14px}
.listen-sheet .type-pills button{width:auto;padding:0;font-size:13px}
.listen-sheet button.on{color:#000}
.listen-sheet button:disabled{color:#d2d2d2}
.listen-sheet-rule{height:1px;margin:4px 14px;background:rgba(0,0,0,.08)}
.listen-sheet .paper-lock{color:#111}
@media(max-width:420px){
  .listen-top,.listen-foot{padding-left:16px;padding-right:16px}
  .scroll-inner,.page-body{width:min(calc(100% - 32px),46ch)}
  .listen-track{width:min(calc(100% - 32px),46ch)}
}
@media(max-width:359px){
  .listen-controls .mode-seg button{font-size:10px;padding:0 3px}
  #btn-chapter{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  .listen-art,.listen-flow,.listen-progress-wrap,.listen-track,.listen-top{transition:none}
}
.list-section,.list-rail .section{display:flex;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.list-section::after,.list-rail .section::after{content:'\2013';margin-left:auto;color:var(--muted);font-size:12px}
.list-section.is-collapsed::after,.list-rail .section.is-collapsed::after{content:'+'}
.sec-body.is-collapsed{display:none}
@media(min-width:900px){
  body.is-list main,body.is-detail main{display:grid;grid-template-columns:240px 1fr}
  .list-rail{display:block;border-right:1px solid var(--line);overflow:auto}
  body.is-list .list-view,body.is-detail .list-view{display:none}
  body.is-list .detail,body.is-detail .detail{display:block}
  .back-shelf{display:none}
  .list-rail .row{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
  .list-rail .row.on{background:rgba(0,0,0,.045);border-left:2px solid var(--text)}
  .list-rail .row .t{font-size:13px;font-weight:700}
  .list-rail .row .m{font-size:10px;color:var(--muted);margin-top:3px;font-weight:400}
  .list-rail .section{padding:16px 18px;font-size:13px;font-weight:700;letter-spacing:-.02em;text-transform:none;color:var(--text)}
}
@media(max-width:899px){
  .list-rail{display:none}
  body.is-list:not(.is-detail) .list-view{display:block}
  body.is-detail .list-view,
  body.is-detail .gallery{display:none !important}
  body.is-detail .detail{display:block}
}
</style>
</head>
<body class="is-list">
<div class="shell">
  <div class="preview-banner">ARCHIVE \u00b7 dglxss. \u00b7 catalog</div>
  <header class="site-hd">
    <button class="brand" id="btn-home" type="button">Archive <span>/ dglxss.</span></button>
    <div class="controls">
      <button class="ctrl on" id="btn-list" type="button">List</button>
      <button class="ctrl" id="btn-gallery" type="button">Gallery</button>
    </div>
  </header>
  <main>
    <aside class="list-rail" id="list-rail"></aside>
    <section>
      <div class="list-view" id="list-view"></div>
      <div class="gallery" id="gallery"></div>
      <div class="detail" id="detail"></div>
    </section>
  </main>
</div>
<div class="reader-root mode-pages" id="reader" data-size="m" data-mode="pages">
  <header class="listen-top">
    <div class="listen-nav">
      <button type="button" id="btn-library">library</button>
      <button type="button" id="btn-edit" aria-haspopup="true" aria-expanded="false" aria-controls="edit-sheet">edit</button>
    </div>
    <h1 class="listen-title"><span class="listen-name" id="listen-name"></span><span class="listen-by" id="listen-by"></span></h1>
    <div class="listen-sheet" id="edit-sheet" role="dialog" aria-label="Reading settings">
      <div class="type-row">
        <span class="type-label">size</span>
        <div class="type-pills">
          <button type="button" data-size="s">s</button>
          <button type="button" data-size="m" class="on">m</button>
          <button type="button" data-size="l">l</button>
        </div>
      </div>
      <div class="type-row speed-row">
        <span class="type-label">speed</span>
        <div class="type-pills">
          <button type="button" data-speed="0.75">.75</button>
          <button type="button" data-speed="1" class="on">1</button>
          <button type="button" data-speed="1.25">1.25</button>
          <button type="button" data-speed="1.5">1.5</button>
        </div>
      </div>
      <div class="type-row">
        <span class="type-label">paper</span>
        <div class="type-pills"><span class="paper-lock">white</span></div>
      </div>
    </div>
  </header>
  <div class="listen-stage">
    <div class="listen-art" id="listen-art" aria-hidden="true">
      <pre id="listen-mark"></pre>
      <div class="listen-dots"><i></i><i class="on"></i><i class="on"></i><i></i></div>
    </div>
    <div class="listen-viewport" id="listen-viewport">
      <div class="listen-flow" id="listen-flow">
        <div class="listen-track" id="listen-track"></div>
      </div>
      <div class="listen-fade listen-fade-top"></div>
      <div class="listen-fade listen-fade-bot"></div>
    </div>
    <div class="scroll-view" id="scroll-view">
      <div class="scroll-inner" id="scroll-inner"></div>
    </div>
    <div class="pageview" id="pageview">
      <button class="reader-edge left" id="edge-left" type="button" aria-label="Previous page"></button>
      <div class="page-body" id="page-body"></div>
      <button class="reader-edge right" id="edge-right" type="button" aria-label="Next page"></button>
    </div>
  </div>
  <footer class="listen-foot">
    <div class="listen-sheet" id="chapter-sheet" role="dialog" aria-label="Chapters"></div>
    <div class="listen-progress-wrap">
      <button type="button" class="listen-progress" id="listen-progress" aria-label="Reading progress"><span class="listen-progress-fill" id="listen-progress-fill"></span></button>
    </div>
    <div class="listen-controls">
      <div class="mode-seg" role="group" aria-label="Reading mode">
        <button type="button" id="btn-mode-autoplay" data-mode="autoplay" aria-pressed="false">Autoplay</button>
        <button type="button" id="btn-mode-scroll" data-mode="scroll" aria-pressed="false">Scroll</button>
        <button type="button" id="btn-mode-pages" data-mode="pages" aria-pressed="true" class="on">Pages</button>
      </div>
      <div class="listen-transport">
        <button type="button" id="btn-play" aria-pressed="false" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.7 1.35v9.3L10.15 6z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.05 1.35h2.55v9.3H2.05zm5.35 0h2.55v9.3H7.4z" fill="currentColor"/></svg>
        </button>
        <button type="button" id="btn-chapter" aria-haspopup="true" aria-expanded="false" aria-controls="chapter-sheet">chapter 01</button>
      </div>
    </div>
    <div class="page-foot" id="page-foot"><span id="page-left"></span><span id="page-right"></span></div>
  </footer>
</div>
<script src="/archive.js"></script>
</body>
</html>
