<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="manifest" href="/manifest.json"/>
<title>Archive — dglxss.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,650;7..72,700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f4f3f0;--paper:#fbf9f4;--paper-solid:#fafaf8;--text:#0a0a0a;--muted:#6a6a6a;--line:rgba(0,0,0,.1);--line-strong:rgba(0,0,0,.22);--page:#fbf9f4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}a{color:inherit;text-decoration:none}
button:not(:disabled){cursor:pointer}
.shell{min-height:100%;display:flex;flex-direction:column}
.preview-banner{font-size:10px;font-weight:500;letter-spacing:.04em;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
header.site-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(251,249,244,.92)}
.brand{font-weight:600;font-size:13px;letter-spacing:.02em;background:none;border:0;color:inherit;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.brand span{font-weight:400;color:var(--muted)}
.hd-tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.search-btn{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#1c1c1c;display:flex;align-items:center;justify-content:center;padding:0}
.search-btn[aria-pressed="true"]{background:rgba(0,0,0,.06)}
.search-btn:focus-visible{outline:2px solid #1c1c1c;outline-offset:2px}
.view-seg button:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
.view-seg{box-sizing:content-box;display:flex;align-items:stretch;height:28px;padding:0;border:1px solid #1c1c1c;border-radius:999px;overflow:hidden;background:#fbf9f4;flex-shrink:0}
.view-seg button{box-sizing:border-box;flex:0 0 28px;width:28px;min-width:28px;height:28px;min-height:28px;border:0;background:transparent;color:#1c1c1c;display:flex;align-items:center;justify-content:center;padding:0}
.view-seg button.on{background:#1c1c1c;color:#f4f1ea}
.search-bar{flex:1 0 100%;padding:2px 0 0}
.search-bar[hidden]{display:none}
.search-bar input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);color:var(--text);padding:0 10px;font-size:13px}
.controls{display:flex;gap:4px}
.ctrl{font-size:11px;font-weight:500;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;height:28px}
.ctrl.on{color:var(--text);border-color:var(--text)}
main{flex:1}
.list-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:hover{background:rgba(0,0,0,.02)}
.list-row .t{font-size:15px;font-weight:700;letter-spacing:-.02em}
.list-row .m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.list-row.soon{opacity:.78}
.list-section{padding:18px 20px;font-size:15px;font-weight:700;letter-spacing:-.02em;text-transform:none;color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.list-section .sec-copy,.list-rail .section .sec-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1 1 auto;padding-right:14px}
.list-section .t,.list-rail .section .t{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.list-section .m,.list-rail .section .m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:400;letter-spacing:0;line-height:1.45;max-width:62ch}
.gallery{display:none;padding:32px 24px 48px;gap:20px;grid-template-columns:repeat(auto-fill,minmax(180px,220px));justify-content:center;max-width:920px;margin:0 auto}
body.is-gallery .list-view{display:none}
body.is-gallery .gallery{display:grid}
.g-card{border:1px solid var(--line);background:var(--paper-solid);cursor:pointer;overflow:hidden}
.g-cover{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 14px;font-size:14px;font-weight:700;letter-spacing:.06em;background:#ecebe4;border-bottom:1px solid var(--line)}
.g-meta{padding:12px 14px}
.g-meta .t{font-size:13px;font-weight:700}
.g-meta .m{font-size:11px;color:var(--muted);margin-top:3px}
.detail{display:none;padding:28px 22px 64px;max-width:680px;margin:0 auto}
body.is-detail .detail{display:block}
body.is-detail .list-view,body.is-detail .gallery,body.is-detail .book-grid,body.is-detail .row-view{display:none}
.book-grid,.row-view{display:none}
body.is-grid:not(.is-detail) .book-grid{display:grid}
body.is-rows:not(.is-detail) .row-view{display:block}
body.is-grid .list-view,body.is-rows .list-view,body.is-grid .gallery,body.is-rows .gallery{display:none}
.book-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 16px 56px;align-items:stretch;width:100%;max-width:720px;margin:0 auto}
.book-card{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4.05;min-width:0;border:0;border-radius:8px;padding:12px 10px 10px;text-align:left;font-family:inherit;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
.book-card .copy{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 auto}
.book-card .t{font-size:12px;font-weight:600;line-height:1.28;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.book-card .s{margin-top:6px;font-size:10px;font-weight:400;line-height:1.35;letter-spacing:0;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-card.swatch-deep .s{opacity:1;color:#fbf6ee}
.book-card .y{margin-top:10px;font-size:12px;font-weight:500;letter-spacing:-.01em;flex-shrink:0}
@media(max-width:520px){
  .book-card .t{-webkit-line-clamp:4}
}
.book-card.soon,.compact-row.soon{opacity:.72}
.compact-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;padding:14px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left;font-family:inherit;cursor:pointer}
.compact-row .copy{display:flex;flex-direction:column;min-width:0;gap:3px}
.compact-row .t{font-size:14px;font-weight:700;letter-spacing:-.02em;min-width:0}
.compact-row .s{font-size:10px;color:var(--muted);font-weight:400;line-height:1.35}
.compact-row .m{font-size:11px;color:var(--muted);flex-shrink:0;font-weight:400}
.compact-row:hover{background:rgba(0,0,0,.02)}
.shelf-empty{padding:28px 20px;color:var(--muted);font-size:12px}
@media(min-width:800px){
  .book-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:24px 24px 64px}
}
.back-shelf{display:block;border:0;background:none;color:var(--muted);font-size:11px;padding:0 0 18px;letter-spacing:.02em}
.detail h1{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-bottom:6px}
.detail .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.55;font-weight:400}
.detail .blurb{font-size:13.5px;line-height:1.7;margin-bottom:22px;max-width:42ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-size:11px;font-weight:600;padding:10px 14px;border:1px solid var(--text);background:transparent;color:var(--text);height:36px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.ghost{border-color:var(--line-strong)}
.btn:disabled{opacity:.45}
.audio-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.audio-row audio,.reader-player audio{width:100%;height:36px}
.audio-credit{font-size:11px;color:var(--muted);margin:0 0 8px}
.skip{display:flex;gap:8px;margin:10px 0 0}
.skip button{flex:1;height:32px;border:1px solid var(--text);background:transparent;color:var(--text);font-size:11px;font-weight:600}
.audio-status{font-size:11px;color:var(--muted);margin:8px 0 0}
body.reader-open{overflow:hidden}
.reader-root{display:none;position:fixed;inset:0;z-index:40;background:#fff;color:#141414;--listen-size:18px;font-size:var(--listen-size);line-height:1.6;font-family:Literata,Georgia,'Iowan Old Style',Palatino,serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.reader-root[data-size="s"]{--listen-size:17px}
.reader-root[data-size="m"]{--listen-size:18px}
.reader-root[data-size="l"]{--listen-size:21px}
.reader-root.open{display:flex;flex-direction:column}
.reader-root button,.reader-root a{font-family:'JetBrains Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
.reader-root button:focus-visible,.reader-root a:focus-visible{outline:1px solid #000;outline-offset:3px}
.listen-top,.listen-foot{width:min(100%,calc(46ch + 64px));margin:0 auto;padding-left:32px;padding-right:32px;position:relative;z-index:4;flex-shrink:0}
.listen-top{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:14px}
.listen-nav,.listen-title{transition:opacity .45s ease,transform .45s ease}
.listen-nav,.listen-controls{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:1.4;font-weight:400;gap:10px;min-width:0}
.listen-nav button,.listen-controls button,.listen-nav a{border:0;background:transparent;padding:6px 0;color:#8d8d8d;font-size:13px;line-height:1;font-weight:400;text-decoration:none}
.listen-nav-actions{display:flex;align-items:center;gap:16px;flex:0 0 auto}
#btn-library,#btn-play,#btn-pdf,#btn-edit{color:#111}
#btn-pdf[hidden]{display:none}
#btn-edit{font-family:Literata,Georgia,serif;font-weight:650;font-size:20px;letter-spacing:-.03em;line-height:1;min-width:44px;min-height:44px;padding:0 2px;display:inline-flex;align-items:center;justify-content:center}
.speed-chip{flex:0 0 auto;border:0;background:transparent;color:#8d8d8d;font-size:11px;line-height:1;padding:8px 0;font-variant-numeric:tabular-nums}
.reader-root:not([data-mode="autoplay"]) .speed-chip{display:none}
.mode-seg{display:flex;align-items:center;flex:0 0 auto;max-width:17.5rem;gap:2px}
.listen-controls .mode-seg button{flex:0 0 auto;height:26px;padding:0 6px;border-radius:999px;font-size:11px;line-height:1;color:#8d8d8d;text-align:center;white-space:nowrap}
.listen-controls .mode-seg button.on{background:#111;color:#fff}
.listen-transport{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex:1 1 auto;min-width:0;margin-left:8px;overflow:hidden}
#btn-play{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0}
#btn-play .icon-pause{display:none}
#btn-play[aria-pressed="true"] .icon-play{display:none}
#btn-play[aria-pressed="true"] .icon-pause{display:block}
#btn-play:disabled{opacity:.35}
.reader-root:not([data-mode="autoplay"]) #btn-play{display:none}
#btn-chapter{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.page-foot{display:none;justify-content:space-between;align-items:baseline;gap:12px;padding-top:8px;font-size:10px;letter-spacing:.04em;color:#8d8d8d;min-width:0}
.reader-root[data-mode="pages"] .page-foot{display:flex}
#page-left{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#page-right{flex-shrink:0;font-variant-numeric:tabular-nums}
.listen-title{margin:16px 0 0;font-size:14px;font-weight:400;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listen-name{color:#111}
.listen-by{color:#9a9a9a}
.listen-stage{position:relative;flex:1;min-height:0}
.listen-art{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#9a9a9a;transition:opacity .5s ease,transform .55s ease}
.reader-root:not([data-series="tvn"]) .listen-art{display:none}
.listen-art .ornament{display:block}
.reader-root[data-mode="autoplay"].is-reading .listen-nav,
.reader-root[data-mode="autoplay"].is-reading .listen-title{opacity:0;transform:translateY(-10px);pointer-events:none}
.reader-root[data-mode="autoplay"].is-reading .listen-nav button,
.reader-root[data-mode="autoplay"].is-reading .listen-nav a{pointer-events:auto}
.reader-root[data-mode="autoplay"] #pageview{display:block;pointer-events:none;background:transparent}
.reader-root[data-mode="autoplay"] #pageview .page-body{display:none}
.reader-root[data-mode="autoplay"] .reader-edge{pointer-events:auto}
.reader-root.is-reading .listen-art{opacity:0;transform:translateY(-14px)}
.listen-viewport{position:absolute;inset:0;overflow:hidden;z-index:1;touch-action:none}
.reader-root:not([data-mode="autoplay"]) .listen-viewport,
.reader-root:not([data-mode="autoplay"]) .listen-art{display:none}
.listen-flow{opacity:0;transition:opacity .55s ease}
.reader-root.is-reading .listen-flow{opacity:1}
.scroll-view{display:none;position:absolute;inset:0;z-index:1;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y}
.scroll-view::-webkit-scrollbar{display:none}
.reader-root[data-mode="scroll"] .scroll-view{display:block}
.scroll-inner{width:min(calc(100% - 64px),40ch);margin:0 auto;padding:1.15rem 0 72vh}
.scroll-inner .chapter-label,.page-body .pg-label{font-family:'JetBrains Mono',ui-monospace,monospace}
.scroll-inner .chapter-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d;margin:1.85em 0 .95em}
.scroll-inner .chapter-label:first-child{margin-top:.15em}
.scroll-p{margin:0 0 .9em;color:#141414;font-size:1em;line-height:1.6;font-weight:400}
.pageview{display:none;position:absolute;inset:0;z-index:1;flex-direction:column;min-height:0;overflow:hidden}
.reader-root[data-mode="pages"] .pageview{display:flex}
.page-body{flex:1;min-height:0;overflow:hidden;width:min(calc(100% - 64px),40ch);margin:0 auto;padding:1.15rem 0 .4rem;color:#141414;font-size:1em;line-height:1.6}
.page-body .pg-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d;margin:0 0 1.15em}
.page-body p{margin:0 0 .9em}
.page-measure{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-1;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;flex:none!important}
.reader-edge{position:absolute;top:0;bottom:0;width:22%;max-width:96px;z-index:5;border:0;background:transparent;padding:0}
.reader-edge.left{left:0;cursor:w-resize}
.reader-edge.right{right:0;cursor:e-resize}
.reader-root[data-mode="scroll"] .scroll-view,
.reader-root[data-mode="pages"] .page-body{user-select:text;-webkit-user-select:text}
.listen-track{width:min(calc(100% - 64px),40ch);margin:0 auto;padding:0 0 62vh;font-weight:400;text-align:left}
.listen-p{margin:0 0 1.15em;color:#c4c4c4;font-size:1em;line-height:1.6;font-weight:400}
.listen-p.is-active{color:#222}
.listen-p.is-active .w.is-now{color:#000;font-weight:700}
.listen-fade{position:absolute;left:0;right:0;pointer-events:none;z-index:3}
.listen-fade-top{top:0;height:22%;background:linear-gradient(to bottom,#fff 0%,rgba(255,255,255,0) 100%)}
.listen-fade-bot{bottom:0;height:38%;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.78) 46%,rgba(255,255,255,0) 100%)}
.listen-foot{padding-top:4px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.listen-progress-wrap{transition:opacity .4s ease}
.reader-root:not([data-mode="autoplay"]) .listen-progress-wrap,
.reader-root:not([data-mode="autoplay"]) .speed-row{display:none}
.reader-root.is-reading .listen-progress-wrap{opacity:0;pointer-events:none}
.listen-progress{position:relative;display:block;width:100%;height:18px;border:0;background:transparent;padding:0}
.listen-progress::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:#e6e6e6}
.listen-progress-fill{position:absolute;left:0;top:8px;height:1px;width:0%;background:#111;pointer-events:none}
.listen-controls{padding-top:2px}
.listen-sheet{display:none;position:absolute;z-index:6;min-width:220px;max-width:min(320px,calc(100vw - 48px));max-height:46vh;overflow:auto;background:#fff;border:1px solid rgba(0,0,0,.16);box-shadow:0 10px 28px rgba(0,0,0,.08);padding:6px 0}
.listen-sheet.open{display:block}
#edit-sheet{top:calc(100% - 6px);right:32px}
#chapter-sheet{top:auto;bottom:calc(100% - 4px);right:32px}
.listen-sheet .type-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px}
.listen-sheet .type-label{font-size:12px;color:#444}
.listen-sheet .type-pills{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:6px 10px}
.listen-sheet button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#8d8d8d;font-size:13px;line-height:1.35;padding:9px 14px}
.listen-sheet .type-pills button{width:auto;min-width:44px;min-height:44px;padding:0 4px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.listen-sheet button.on{color:#000}
.listen-sheet button:disabled{color:#d2d2d2}
.listen-sheet-rule{height:1px;margin:4px 14px;background:rgba(0,0,0,.08)}
.listen-sheet .paper-lock{color:#111;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.listen-sheet .sheet-kicker{padding:10px 16px 2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d;font-family:'JetBrains Mono',ui-monospace,monospace}
.listen-sheet .comp-switch{display:flex;flex-wrap:wrap;align-items:center;gap:0;padding:8px 14px 2px}
.listen-sheet .comp-switch button{display:inline;width:auto;padding:8px 0;font-size:12px}
.listen-sheet .comp-switch button+button::before{content:'\00b7';color:#c8c8c8;padding:0 8px}
.listen-sheet .comp-switch button.on{position:relative;background:#111;color:#fff;border-radius:999px;padding:4px 8px}
.listen-sheet .comp-switch button+button.on{margin-left:calc(16px + .6em)}
.listen-sheet .comp-switch button+button.on::before{position:absolute;right:100%;top:50%;transform:translateY(-50%);background:transparent;color:#c8c8c8}
.reader-root[data-role="screenplay"] .scroll-inner,
.reader-root[data-role="screenplay"] .page-body,
.reader-root[data-role="screenplay"] .listen-track{font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1.55}
.reader-root[data-role="screenplay"] .sp-slug{font-weight:600;letter-spacing:.04em;margin-top:1.25em}
.reader-root[data-role="screenplay"] .sp-cue{text-align:center;font-weight:600;letter-spacing:.06em;margin:1em 0 .15em}
.reader-root[data-role="screenplay"] .sp-dialogue{width:min(100%,32ch);margin-left:auto;margin-right:auto}
.reader-root[data-role="screenplay"] .sp-paren{width:min(100%,28ch);margin-left:auto;margin-right:auto;text-align:center;font-style:italic}
.reader-root[data-role="screenplay"] .sp-trans{text-align:right;letter-spacing:.08em;font-weight:600;margin:1em 0}
.role-mark{font-size:10px;font-weight:500;letter-spacing:.03em;color:var(--muted)}
.book-card .role-mark{color:inherit;opacity:1}
@media(max-width:420px){
  .listen-top,.listen-foot{padding-left:16px;padding-right:16px}
  .scroll-inner,.page-body{width:min(calc(100% - 40px),40ch)}
  .listen-track{width:min(calc(100% - 40px),40ch)}
}
@media(max-width:480px){
  #btn-play{width:44px;height:44px;min-width:44px;min-height:44px;margin:-8px}
  .speed-chip{min-width:44px;min-height:44px;margin-top:-10px;margin-bottom:-10px;padding:10px 8px;display:inline-flex;align-items:center;justify-content:center}
  .reader-edge{top:auto;bottom:0;height:max(44px,18vh);min-height:44px;min-width:44px}
  .listen-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:640px){
  #edit-sheet.listen-sheet{position:fixed;left:0;right:0;top:auto;bottom:0;max-width:none;width:auto;max-height:min(70vh,420px);border:0;border-top:1px solid rgba(0,0,0,.18);box-shadow:0 -10px 28px rgba(0,0,0,.1);padding:8px 0 calc(12px + env(safe-area-inset-bottom));z-index:30}
}
@media(max-width:359px){
  .listen-controls .mode-seg button{font-size:10px;padding:0 3px}
  #btn-chapter{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
