<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Join — Archive — dglxss.</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--page:#fbf9f4;--text:#0a0a0a;--muted:#6a6a6a;--line:rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--page);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
header span{font-size:11px;color:var(--muted)}
main{max-width:28rem;margin:0 auto;padding:3rem 1.5rem}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.sub{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 28px}
.price{font-size:22px;font-weight:700;margin:0 0 6px}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 28px}
.btn{display:block;text-align:center;height:40px;line-height:38px;border:1px solid var(--text);font-size:11px;font-weight:600}
.btn.off{opacity:.45;pointer-events:none}
.btn.ghost{margin-top:8px}
</style>
</head>
<body>
<header><a href="/">← Archive</a><span>Join</span></header>
<main>
  <h1>Archive membership</h1>
  <div class="note">One access price for the digital shelf. Amount not set. Payments stay off until Stripe is connected. Testers use an access code.</div>
  <a class="btn off" href="#" aria-disabled="true">Pay with Stripe — next</a>
  <a class="btn ghost" id="enter-link" href="/enter">I have an access code</a>
</main>
<script>
(function(){
  var raw=new URLSearchParams(location.search).get('next');
  var next=(!raw || raw.charAt(0)!=='/' || raw.indexOf('//')===0 || raw.indexOf('\\')>=0) ? '' : raw;
  var a=document.getElementById('enter-link');
  if(a && next) a.href='/enter?next='+encodeURIComponent(next);
})();
</script>
</body>
</html>
