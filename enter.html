<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enter — Archive — dglxss.</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--page:#fbf9f4;--text:#0a0a0a;--muted:#6a6a6a;--line:rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--page);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
header span{font-size:11px;color:var(--muted)}
main{max-width:28rem;margin:0 auto;padding:3rem 1.5rem}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.sub{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 28px}
label{display:block;font-size:11px;color:var(--muted);margin:0 0 8px}
input{width:100%;height:40px;border:1px solid var(--text);background:transparent;padding:0 12px;font:inherit}
button{margin-top:12px;width:100%;height:40px;border:1px solid var(--text);background:var(--text);color:var(--page);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.status{font-size:11px;color:var(--muted);margin:12px 0 0;min-height:1.2em}
</style>
</head>
<body>
<header><a href="/">← Archive</a><span>Enter</span></header>
<main>
  <h1>Member access</h1>
  <div class="sub">One access price for the shelf. Amount later. For now this is a code.</div>
  <form id="form">
    <label for="code">Access code</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required/>
    <button type="submit">Enter</button>
  </form>
  <div class="status" id="status"></div>
</main>
<script>
document.getElementById('form').onsubmit=function(e){
  e.preventDefault();
  var st=document.getElementById('status');
  st.textContent='Checking.';
  fetch('/api/session',{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({code:document.getElementById('code').value})
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); }).then(function(x){
    if(!x.ok){ st.textContent=x.d.error||'Wrong code.'; return; }
    location.href=new URLSearchParams(location.search).get('next')||'/listen';
  }).catch(function(){ st.textContent='Could not reach the archive.'; });
};
</script>
</body>
</html>
